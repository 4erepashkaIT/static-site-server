server {
    listen 80;
    listen [::]:80;
    server_name _;               # пока домена нет; потом впишешь его сюда

    root  /var/www/igor-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/igor-site.access.log;
    error_log  /var/log/nginx/igor-site.error.log;
}
